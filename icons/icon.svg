<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1"/>
      <stop offset="50%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#EC4899"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Fond avec dégradé violet-rose -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bg)"/>

  <!-- Reflet brillant -->
  <ellipse cx="45" cy="35" rx="35" ry="25" fill="url(#shine)"/>

  <!-- Loupe stylisée -->
  <circle cx="56" cy="52" r="26" fill="none" stroke="white" stroke-width="6" opacity="0.95"/>
  <line x1="75" y1="71" x2="96" y2="92" stroke="white" stroke-width="7" stroke-linecap="round" opacity="0.95"/>

  <!-- Checkmark vert dans la loupe -->
  <circle cx="56" cy="52" r="17" fill="#10B981"/>
  <path d="M46 52 L53 59 L67 45" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Étoile décorative -->
  <circle cx="98" cy="28" r="8" fill="#FCD34D"/>
  <circle cx="24" cy="98" r="5" fill="#34D399"/>
  <circle cx="104" cy="74" r="4" fill="#F472B6"/>
</svg>
